# ── Docker Compose Production Stack ──────────────────────────────────────────
# AI Virtual Brain System — Phase 15 Enterprise Deployment
# Services: Orchestrator, Gateway, PostgreSQL, Redis, Kafka, Prometheus, Grafana
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

x-common-env: &common-env
  LOG_LEVEL: INFO
  DEBUG: "false"
  PYTHONUNBUFFERED: "1"

services:
  # ── Core: AI Virtual Brain Orchestrator ──────────────────────────────
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: vbrain-orchestrator
    ports:
      - "${ORCHESTRATOR_PORT:-8001}:8001"
    environment:
      <<: *common-env
      HOST: "0.0.0.0"
      PORT: "8001"
      DATABASE_URL: "postgresql://vbrain:${POSTGRES_PASSWORD:-vbrain_secret}@postgres:5432/vbrain"
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PROMETHEUS_ENABLED: "true"
      DISTRIBUTED_MODE: "false"
      CLUSTER_NODE_ID: "node-primary"
      SECURITY_ENABLED: "false"
      CIRCUIT_BREAKER_ENABLED: "true"
      DLQ_ENABLED: "true"
    volumes:
      - vbrain-data:/app/data
      - vbrain-logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - vbrain-network

  # ── PostgreSQL Database ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vbrain-postgres
    environment:
      POSTGRES_DB: vbrain
      POSTGRES_USER: vbrain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vbrain_secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vbrain -d vbrain"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - vbrain-network

  # ── Redis Cache ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vbrain-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - vbrain-network

  # ── Apache Kafka ────────────────────────────────────────────────────
  kafka:
    image: bitnami/kafka:3.6
    container_name: vbrain-kafka
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/bitnami/kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    restart: unless-stopped
    networks:
      - vbrain-network

  # ── Prometheus Monitoring ───────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: vbrain-prometheus
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped
    networks:
      - vbrain-network

  # ── Grafana Dashboards ──────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.0
    container_name: vbrain-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - vbrain-network

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  vbrain-data:
  vbrain-logs:
  postgres-data:
  redis-data:
  kafka-data:
  prometheus-data:
  grafana-data:

# ── Networks ───────────────────────────────────────────────────────────────
networks:
  vbrain-network:
    driver: bridge
