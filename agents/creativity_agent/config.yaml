# Creativity Agent Configuration — Phase 10 Production Configuration

# Idea generation settings
idea_generation:
  num_ideas_to_generate: 5
  max_idea_history: 1000
  evaluation_weights:
    originality: 0.4
    feasibility: 0.3
    impact: 0.3
  constraints:
    min_originality: 0.4
    min_feasibility: 0.35
    min_impact: 0.30

# Convergent Thinking settings
convergent:
  ranking_policy: "weighted_pareto"
  min_acceptance_score: 0.5
  max_recommendations: 3
  risk_scoring_enabled: true
  cost_benefit_analysis_enabled: true

# Design Thinking settings
design_thinking:
  default_test_duration: "2 weeks"
  user_personas_per_domain: 3
  prototype_fidelities: ["low", "medium", "high"]
  min_sus_score_target: 4.0

# Concept Synthesis settings
concept_synthesis:
  max_source_domains: 5
  fusion_confidence_threshold: 0.7
  white_space_opportunity_limit: 5

# Innovation Engine settings
innovation:
  default_type: "incremental"
  supported_types:
    - "incremental"
    - "radical"
    - "process"
    - "product"
    - "service"
    - "workflow"
    - "architecture"
  plugins_enabled: true

# Audit and Replay settings
audit_replay:
  enabled: true
  max_audit_entries_per_session: 100
  snapshot_persistence: true
  auto_replay_verification: true

# Pattern recognition settings
pattern_recognition:
  max_pattern_history: 1000
  pattern_types:
    structural:
      enabled: true
      weight: 0.3
    temporal:
      enabled: true
      weight: 0.3
    semantic:
      enabled: true
      weight: 0.4
  similarity_threshold: 0.7
  min_pattern_confidence: 0.6

# Inspiration settings
inspiration:
  max_inspiration_history: 1000
  sources:
    art:
      enabled: true
      weight: 0.2
      elements: ["visual", "conceptual", "emotional"]
    science:
      enabled: true
      weight: 0.2
      elements: ["principles", "discoveries", "theories"]
    nature:
      enabled: true
      weight: 0.2
      elements: ["patterns", "systems", "adaptations"]
    technology:
      enabled: true
      weight: 0.2
      elements: ["solutions", "advancements", "applications"]
    culture:
      enabled: true
      weight: 0.2
      elements: ["traditions", "values", "expressions"]
  relevance_threshold: 0.6
  max_elements_per_source: 10

# Integration settings
integration:
  confidence_weights:
    idea_generation: 0.4
    pattern_recognition: 0.3
    inspiration: 0.3
  validation:
    cross_component_threshold: 0.7
    temporal_window: 5  # seconds

# Storage settings
storage:
  base_path: "data/creativity"
  max_file_size: 10485760  # 10MB
  backup_count: 5
  history:
    enabled: true
    max_entries: 1000
    cleanup_interval: 3600  # seconds

# Performance settings
performance:
  cache_size: 1000
  cleanup_interval: 3600  # seconds
  max_concurrent_requests: 10
  batch_processing: true
  batch_size: 32

# Logging settings
logging:
  level: "INFO"
  file: "logs/creativity_agent.log"
  max_file_size: 10485760  # 10MB
  backup_count: 5
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Model settings
models:
  idea_generation:
    provider: "huggingface"
    model: "gpt2"
    temperature: 0.8
    max_tokens: 200
  pattern_recognition:
    provider: "sklearn"
    model: "tfidf_dbscan"
  inspiration:
    provider: "huggingface"
    model: "gpt2"
    temperature: 0.7

# Security settings
security:
  max_requests_per_minute: 60
  allowed_origins: ["*"]
  require_authentication: true
  token_expiry: 3600  # seconds
  encryption:
    enabled: true
    algorithm: "AES-256"